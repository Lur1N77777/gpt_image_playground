name = "gpt-image-playground-worker"
main = "workers/image-consumer.ts"
compatibility_date = "2026-04-25"
workers_dev = false
preview_urls = false

[vars]
CLEANUP_RETENTION_DAYS = "1"
IMAGE_MAX_ATTEMPTS = "2"

[triggers]
# Hourly checker. Actual cleanup is disabled by default and only runs when admin sets an interval.
crons = ["0 * * * *"]

[[d1_databases]]
binding = "IMAGE_DB"
database_name = "gpt-image-playground-db"
database_id = "1c7b76fb-7194-4fb4-ae57-e45e520b9ca3"

[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "gpt-image-playground-images"

[[queues.consumers]]
queue = "gpt-image-playground-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 1
